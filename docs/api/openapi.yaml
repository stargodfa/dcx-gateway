components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-token
    GatewayToken:
      type: apiKey
      in: header
      name: X-Gateway-Token

  parameters:
    ScriptID:
      name: id
      in: path
      required: true
      schema: {type: string}

  requestBodies:
    RawJSONObject:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
            example:
              version: 1
              name: raw_config_document

  responses:
    DataBundleResponse:
      description: Wrapped DataBundle response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DataBundleEnvelope"
    PreloadResponse:
      description: Wrapped preload response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PreloadEnvelope"
    ConfigIndexResponse:
      description: Config index body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConfigIndex"
    RawDocumentResponse:
      description: Raw config document
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RawDocumentExample"
    InitConfigResponse:
      description: init_config body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InitConfig"
    ModelTypesResponse:
      description: model-types body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ModelTypesConfig"
    ModelTableResponse:
      description: model-table body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ModelTable"
    ModelConfigResponse:
      description: model_config body. Shape depends on mode.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/StructuredModelConfig"
              - $ref: "#/components/schemas/RuntimeModelConfig"
              - $ref: "#/components/schemas/RawModelConfig"
    StructuredModelConfigResponse:
      description: structured model_config body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StructuredModelConfig"
    SceneDesiredResponse:
      description: scene_desired body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SceneDesiredConfig"
    ChartBindingResponse:
      description: chart_binding body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ChartBinding"
    VideoStreamsResponse:
      description: video_streams body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VideoStreams"
    ChartConfigResponse:
      description: chart_config body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ChartConfig"
    ReportScriptsResponse:
      description: report_scripts body
      content:
        application/json:
          schema:
            oneOf:
              - $ref: "#/components/schemas/ReportScripts"
              - $ref: "#/components/schemas/LightReportScripts"
    DroneConfigResponse:
      description: drone_config body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DroneConfig"
    PathConfigResponse:
      description: path_config body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PathConfig"
    RenderConfigResponse:
      description: render_config body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RenderConfig"
    JSONError:
      description: error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {type: string}
    RequestTooLarge:
      description: request body too large
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {type: string, example: request body too large}

  schemas:
    AuxModelAnchor:
      type: object
      required: [anchor_id]
      additionalProperties: true
      properties:
        anchor_id: {type: string, minLength: 1, maxLength: 64}
        instance_id: {type: string, maxLength: 128}
        revision:
          type: integer
          minimum: 0
          maximum: 2147483647
          nullable: true
          description: Current revision on update; absent/null/0/1 on create. Saved revision starts at 1.
        title: {type: string}
        device_id: {type: string}
        local_position: {type: object, additionalProperties: true}
        local_normal: {type: object, additionalProperties: true}
    AuxSensorDevice:
      type: object
      required: [device_id]
      additionalProperties: true
      properties:
        device_id: {type: string, minLength: 1, maxLength: 128}
        display_name: {type: string}
        device_type: {type: string}
        status: {type: string}
        fault_message: {type: string}
        updated_at: {type: integer, format: int64}
    AuxAgent:
      type: object
      additionalProperties: true
      properties:
        nodeId:
          type: string
          description: Set from the path or the agents map key.
        enabled: {type: boolean}
    AuxModelAnchorsConfig:
      type: object
      required: [anchors]
      properties:
        version: {type: integer, enum: [1]}
        anchors:
          type: array
          items: {$ref: "#/components/schemas/AuxModelAnchor"}
    AuxSensorDevicesConfig:
      type: object
      required: [devices]
      properties:
        version: {type: integer, enum: [1]}
        devices:
          type: array
          items: {$ref: "#/components/schemas/AuxSensorDevice"}
    AuxCatalogConfig:
      type: object
      required: [agents]
      properties:
        version: {type: integer, enum: [1]}
        updatedAt:
          type: number
          format: double
          readOnly: true
          description: Latest database updated_at in Unix seconds; 0 for an empty catalog.
        agents:
          type: object
          additionalProperties: {$ref: "#/components/schemas/AuxAgent"}
    AuxCatalogReplaceResponse:
      type: object
      properties:
        version: {type: integer, enum: [1]}
        agents:
          type: object
          additionalProperties: {$ref: "#/components/schemas/AuxAgent"}
    AuxRegistryConfig:
      type: object
      required: [agents]
      properties:
        version: {type: integer, enum: [1]}
        agents:
          type: object
          additionalProperties: {$ref: "#/components/schemas/AuxAgent"}
        authorizedWhitelist:
          type: array
          readOnly: true
          items: {type: string}
          description: Sorted IDs derived from enabled=true entries; never trusted from input.
    AuxRegistryUpsertResponse:
      type: object
      properties:
        agents:
          type: object
          additionalProperties: {$ref: "#/components/schemas/AuxAgent"}
        authorizedWhitelist:
          type: array
          items: {type: string}
    AuxDeleteAnchors:
      type: object
      anyOf:
        - required: [anchor_id]
        - required: [anchor_ids]
      properties:
        anchor_id: {type: string, minLength: 1, maxLength: 64}
        anchor_ids:
          type: array
          items: {type: string, minLength: 1, maxLength: 64}
    AuxDeleteDevices:
      type: object
      anyOf:
        - required: [device_id]
        - required: [device_ids]
      properties:
        device_id: {type: string, minLength: 1, maxLength: 128}
        device_ids:
          type: array
          items: {type: string, minLength: 1, maxLength: 128}
    AuxDeleteAgents:
      type: object
      anyOf:
        - required: [node_id]
        - required: [node_ids]
      properties:
        node_id: {type: string, minLength: 1, maxLength: 128}
        node_ids:
          type: array
          items: {type: string, minLength: 1, maxLength: 128}
    AuxDeleteResponse:
      type: object
      properties:
        ok: {type: boolean, example: true}
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: {type: string, example: operator}
        password: {type: string, example: <your-password>}
    AuthUser:
      type: object
      properties:
        username: {type: string, example: operator}
        role: {type: string, example: operator}
    LoginResponse:
      type: object
      properties:
        access_token: {type: string, example: "<token>"}
        token_type: {type: string, example: Bearer}
        expires_in: {type: integer, example: 7200}
        user:
          $ref: "#/components/schemas/AuthUser"
    LogoutResponse:
      type: object
      properties:
        ok: {type: boolean, example: true}
    HealthDependencyCheck:
      type: object
      properties:
        status: {type: string, example: ok}
        configured: {type: boolean, example: true}
    WSDataStatus:
      type: object
      properties:
        enabled: {type: boolean, example: true}
        connected: {type: boolean, example: true}
        ws_data_url: {type: string, example: "ws://127.0.0.1:8000/ws_data"}
        last_connect_time: {type: string, example: "2026-06-11T10:00:00Z"}
        last_disconnect_time: {type: string, example: "2026-06-11T10:05:00Z"}
        last_pong_time: {type: string, example: "2026-06-11T10:04:50Z"}
        last_push_time: {type: string, example: "2026-06-11T10:04:55Z"}
        last_success_time: {type: string, example: "2026-06-11T10:04:55Z"}
        last_error_time: {type: string, example: "2026-06-11T10:05:00Z"}
        last_error: {type: string, example: "websocket: close 1006"}
        success_count: {type: integer, format: int64, example: 12}
        failed_count: {type: integer, format: int64, example: 1}
        reconnect_count: {type: integer, format: int64, example: 2}
        message_count_by_type:
          type: object
          additionalProperties:
            type: integer
            format: int64
          example:
            chart_data_push: 10
            video_streams_set: 2
    DataBundleEnvelope:
      type: object
      properties:
        code: {type: string, example: OK}
        data:
          $ref: "#/components/schemas/DataBundle"
    PreloadEnvelope:
      type: object
      properties:
        code: {type: string, example: OK}
        data:
          $ref: "#/components/schemas/PreloadResult"
    PreloadResult:
      type: object
      properties:
        task_id: {type: string, example: bundle-security_main-20260610T120000Z}
        script_id: {type: string, example: security_main}
        status: {type: string, example: done}
    DataBundle:
      type: object
      properties:
        bundle_id: {type: string, example: bundle-security_main-20260610T120000Z}
        script_id: {type: string, example: security_main}
        scene_id: {type: string, example: campus_security}
        data_script_id:
          type: string
          example: security_main
          description: Alias for script_id that explicitly means Gateway DataBundle script id.
        data_scene_id:
          type: string
          example: campus_security
          description: Alias for scene_id that explicitly means Gateway DataBundle scene id.
        version: {type: string, example: v1}
        generated_at: {type: string, example: "2026-06-10T12:00:00Z"}
        ttl_seconds: {type: integer, example: 60}
        modules:
          type: array
          items:
            $ref: "#/components/schemas/ModuleData"
        charts:
          type: array
          items:
            $ref: "#/components/schemas/ChartData"
        videos:
          type: array
          items:
            $ref: "#/components/schemas/VideoSource"
        model_bindings:
          type: array
          items:
            $ref: "#/components/schemas/ModelBinding"
    ModuleData:
      type: object
      properties:
        module_id: {type: string, example: today_access_card}
        type: {type: string, example: stat_card}
        title: {type: string, example: 今日通行}
        data_key: {type: string, example: security.access.today}
        target_kind: {type: string, example: chart}
        target_id: {type: string, example: chart_h}
        value: {example: 3280}
        unit: {type: string, example: 人次}
        payload: {example: {in_count: 1800, out_count: 1480, total_count: 3280}}
        timestamp: {type: string, example: "2026-06-10T12:00:00Z"}
    ChartData:
      type: object
      properties:
        module_id: {type: string, example: today_access_card}
        data_key: {type: string, example: security.access.today}
        binding_id: {type: string, example: security.access.today}
        chart_id: {type: string, example: chart_h}
        template: {type: string, example: stat_card_basic}
        title: {type: string, example: 今日通行}
        x_axis:
          type: array
          items: {type: string}
          example: ["入校", "出校"]
        series:
          type: array
          items:
            $ref: "#/components/schemas/ChartSeries"
        rows:
          type: array
          items:
            type: array
            items: {type: string}
          example: [["指标", "数值", "单位"], ["今日通行", "3280", "人次"]]
    ChartSeries:
      type: object
      properties:
        name: {type: string, example: 通行人数}
        unit: {type: string, example: 人次}
        data:
          type: array
          items: {type: number}
          example: [1800, 1480]
    VideoSource:
      type: object
      properties:
        video_id: {type: string, example: vs_cam_65}
