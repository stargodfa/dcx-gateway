        local_exposure_highlight: {type: number, example: 1}
        local_exposure_shadow: {type: number, example: 1}
        exposure_bias: {type: number, example: 0}
        tonemapper_gamma: {type: number, example: 2.2}
        contrast: {type: number, example: 1}
        saturation: {type: number, example: 1}
        sharpen: {type: number, example: 0}
        vignette: {type: number, example: 0}
