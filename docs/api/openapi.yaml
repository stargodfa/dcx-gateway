openapi: 3.0.3
info:
  title: dcx-gateway API
  version: "1.0.0"
  description: |
    UE config APIs return the JSON body directly without code/data wrapping.
    scene_desired is a generated read view and has no write API.
    X-Request-Id is echoed in responses. If absent, X-Trace-Id is used; if both are absent, the gateway generates one.
    X-Request-Id and X-Trace-Id are truncated to 128 characters before being logged or echoed.
servers:
  - url: http://localhost:8080
    description: local
  - url: https://dcx-gateway.example.com
    description: lan

security: []

tags:
  - name: auth
  - name: health
  - name: runtime
  - name: scripts
  - name: ue-config-read
  - name: ue-config-init
  - name: ue-config-model-types
  - name: ue-config-model-table
  - name: ue-config-model-config
  - name: ue-config-scene
  - name: ue-config-aux

paths:
  /api/health:
    get:
      tags: [health]
      summary: Health check
      parameters:
        - name: deep
          in: query
          description: When true, checks MySQL ping, Redis ping, and whether fastapi.ws_data_url is configured. Raw dependency errors are logged server-side and are not returned in the HTTP response.
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: ok}
        "503":
          description: degraded when MySQL or Redis check fails
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, example: degraded}
                  checks:
                    type: object
                    properties:
                      mysql:
                        $ref: "#/components/schemas/HealthDependencyCheck"
                      redis:
                        $ref: "#/components/schemas/HealthDependencyCheck"
                      fastapi_ws:
                        $ref: "#/components/schemas/HealthDependencyCheck"

  /api/auth/login:
    post:
      tags: [auth]
      summary: Login and create Redis-backed session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/JSONError"
        "401":
          $ref: "#/components/responses/JSONError"
        "403":
          $ref: "#/components/responses/JSONError"
        "500":
          description: Authentication dependency failed; diagnostic details are logged server-side.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string, example: auth_failed}

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Logout current Bearer token
      security:
        - BearerAuth: []
        - GatewayToken: []
      responses:
        "200":
          description: Logout response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        "401":
          $ref: "#/components/responses/JSONError"

  /api/auth/me:
    get:
      tags: [auth]
      summary: Get current authenticated user
      security:
        - BearerAuth: []
        - GatewayToken: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          $ref: "#/components/responses/JSONError"

  /api/runtime/ws-data/status:
    get:
      tags: [runtime]
      summary: Get FastAPI /ws_data push status
      description: |
        Returns best-effort WebSocket push status and counters. The response never includes auth headers, tokens, or message payloads.
        This GET follows the existing security.protect_read rule: readable without token when protect_read=false, authenticated when protect_read=true.
      responses:
        "200":
          description: Runtime WS status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WSDataStatus"
        "401":
          $ref: "#/components/responses/JSONError"

  /api/ue/runtime/warmup-options:
    get:
      tags: [runtime]
      summary: List UE report scene warmup resource options
      description: |
        Returns editable resource options for UE report scene warmup. data_scripts are Gateway DataBundle scripts.
        warmup.data uses data_script_id, warmup.charts uses chart binding_id, and warmup.videos uses video_id.
        The instances list is for report scene bindings[].instance_id.
        This GET follows the existing security.protect_read rule.
      responses:
        "200":
          description: Warmup resource options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarmupOptions"
        "401":
          $ref: "#/components/responses/JSONError"

  /api/ue/runtime/report-scenes/preload:
    post:
      tags: [runtime]
      summary: Preload data scripts declared by a UE report scene warmup
      description: |
        script_id/chapter_id/scene_id refer to report_scripts, not Gateway DataBundle scripts.
        The gateway reads full/raw report_scripts, finds the scene, and calls PreloadWithOptions for each warmup.data data_script_id.
        First version preloads full data scripts; warmup.charts and warmup.videos are returned as requested resources and are not used to filter WS messages.
      security:
        - BearerAuth: []
        - GatewayToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportScenePreloadRequest"
      responses:
        "200":
          description: Per data_script preload results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportScenePreloadResponse"
        "400":
          $ref: "#/components/responses/JSONError"
        "401":
          $ref: "#/components/responses/JSONError"
        "404":
          $ref: "#/components/responses/JSONError"

  /api/scripts/{id}/data-bundle:
    get:
      tags: [scripts]
      summary: Get DataBundle
      parameters:
        - $ref: "#/components/parameters/ScriptID"
        - name: use_cache
          in: query
          schema: {type: boolean, default: true}
      responses:
        "200":
          $ref: "#/components/responses/DataBundleResponse"

  /api/scripts/{id}/preload:
    post:
      tags: [scripts]
      summary: Preload DataBundle and best-effort push FastAPI /ws_data
      description: The body may be omitted. A supplied body must contain a single JSON object; force, when present, must be a non-null boolean. Invalid requests do not invoke preload.
      security:
        - BearerAuth: []
        - GatewayToken: []
      parameters:
        - $ref: "#/components/parameters/ScriptID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                force: {type: boolean, default: false}
      responses:
        "200":
          $ref: "#/components/responses/PreloadResponse"
        "400":
          description: Invalid JSON body or invalid force type.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: string, example: BAD_REQUEST}
                  message: {type: string, example: body must be a JSON object with an optional boolean force}

  /api/ue/config/index:
    get:
      tags: [ue-config-read]
      summary: List enabled raw config documents
      responses:
        "200":
          $ref: "#/components/responses/ConfigIndexResponse"

  /api/ue/config/raw/{key}:
    get:
      tags: [ue-config-read]
      summary: Read raw JSON document from ue_config_documents
      parameters:
        - name: key
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          $ref: "#/components/responses/RawDocumentResponse"
        "404":
          $ref: "#/components/responses/JSONError"

  /api/ue/config/bootstrap:
    get:
      tags: [ue-config-read]
      summary: Get bootstrap config bundle for Server hydrate
      description: |
        Aggregates raw init/path/chart/drone documents, chart_binding raw if present
        or generated if the raw document is missing, model_table generated,
        model_config runtime, and scene_desired generated. Field names are snake_case.
      responses:
        "200":
          description: Bootstrap config body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapConfig"
        "500":
          $ref: "#/components/responses/JSONError"

  /api/ue/config/init-config:
    get:
      tags: [ue-config-init]
      summary: Get init_config raw JSON
      responses:
        "200":
          $ref: "#/components/responses/InitConfigResponse"
    put:
      tags: [ue-config-init]
      summary: Atomically update non-instance init_config fields
      security:
        - BearerAuth: []
        - GatewayToken: []
      description: Only camera/camera_id/position/rotation/auto_load_on_startup are writable. Instance fields must use instance_ids create/delete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInitConfigRequest"
      responses:
        "200":
          $ref: "#/components/responses/InitConfigResponse"
        "400":
          $ref: "#/components/responses/JSONError"
        "413":
          $ref: "#/components/responses/RequestTooLarge"

  /api/ue/config/init-config/instance_ids/create:
    post:
      tags: [ue-config-init]
      summary: Idempotently add init_config.instance_ids
      security:
        - BearerAuth: []
        - GatewayToken: []
      description: Adds trimmed unique instance ids without validating scene_desired, ue_scene_desired_models, or ue_model_instances.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceIDsRequest"
      responses:
        "200":
          $ref: "#/components/responses/InitConfigResponse"
        "400":
          $ref: "#/components/responses/JSONError"
        "413":
          $ref: "#/components/responses/RequestTooLarge"

  /api/ue/config/init-config/instance_ids/delete:
    delete:
      tags: [ue-config-init]
      summary: Idempotently remove init_config.instance_ids
      security:
        - BearerAuth: []
        - GatewayToken: []
      description: Uses a JSON request body; some HTTP clients/proxies need explicit DELETE body support.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceIDsRequest"
      responses:
        "200":
          $ref: "#/components/responses/InitConfigResponse"
        "400":
          $ref: "#/components/responses/JSONError"
        "413":
          $ref: "#/components/responses/RequestTooLarge"

  /api/ue/config/model-types:
    get:
      tags: [ue-config-model-types]
      summary: Get enabled model_id asset records
      responses:
        "200":
          $ref: "#/components/responses/ModelTypesResponse"
    put:
      tags: [ue-config-model-types]
      summary: Partially update existing model types
      security:
        - BearerAuth: []
        - GatewayToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelTypesRequest"
      responses:
        "200":
          $ref: "#/components/responses/ModelTypesResponse"
        "404":
          $ref: "#/components/responses/JSONError"

  /api/ue/config/model-types/create:
    post:
      tags: [ue-config-model-types]
      summary: Create model types
      security:
        - BearerAuth: []
        - GatewayToken: []
      description: Existing identical model_id is idempotent; different content returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelTypesRequest"
      responses:
        "200":
          $ref: "#/components/responses/ModelTypesResponse"
        "409":
          $ref: "#/components/responses/JSONError"

  /api/ue/config/model-types/delete:
    delete:
      tags: [ue-config-model-types]
      summary: Soft delete model types
      security:
        - BearerAuth: []
        - GatewayToken: []
      description: Uses a JSON request body. Returns 409 when enabled instances still reference the model_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelTypeIDsRequest"
      responses:
        "200":
          $ref: "#/components/responses/ModelTypesResponse"
        "409":
          $ref: "#/components/responses/JSONError"

  /api/ue/config/model-table:
    get:
      tags: [ue-config-model-table]
      summary: Get generated instance catalog
      description: Default mode is generated from ue_model_instances. mode=legacy/raw/full reads raw ue_config_documents.model_table.
      parameters:
        - name: mode
          in: query
          schema:
            type: string
            enum: [generated, legacy, raw, full]
      responses:
        "200":
          $ref: "#/components/responses/ModelTableResponse"

  /api/ue/config/model-table/entries/create:
    post:
      tags: [ue-config-model-table]
      summary: Create instance catalog entries and default placements
      security:
        - BearerAuth: []
        - GatewayToken: []
      description: Existing identical instance_id is idempotent; different content returns 409. This does not add init_config.instance_ids.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelTableEntriesRequest"
      responses:
        "200":
          $ref: "#/components/responses/ModelTableResponse"
        "404":
          $ref: "#/components/responses/JSONError"
        "409":
          $ref: "#/components/responses/JSONError"

  /api/ue/config/model-table/entries:
    put:
      tags: [ue-config-model-table]
      summary: Partially update instance catalog entries
      security:
        - BearerAuth: []
        - GatewayToken: []
      description: |
        Updates only fields present in the request: display_name, model_id, sort_order, enabled.
        Missing fields keep DB values. Missing instance_id returns 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelTableEntriesRequest"
      responses:
        "200":
          $ref: "#/components/responses/ModelTableResponse"
        "404":
          $ref: "#/components/responses/JSONError"

  /api/ue/config/model-table/entries/delete:
    delete:
      tags: [ue-config-model-table]
      summary: Soft delete instance catalog entries
      security:
        - BearerAuth: []
        - GatewayToken: []
      description: Uses a JSON request body. Sets ue_model_instances.enabled=false, does not change init_config, and retained placements are not output while the instance is disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceIDsRequest"
      responses:
        "200":
          $ref: "#/components/responses/ModelTableResponse"

  /api/ue/config/model-config:
    get:
      tags: [ue-config-model-config]
      summary: Get model_config
      description: |
        mode=structured returns placements without bounds.
        mode=runtime returns runtime load config with bounds_size = base_bounds_size * abs(scale).
        mode empty/raw/full/legacy returns the raw model_config document.
      parameters:
        - name: mode
          in: query
          schema:
            type: string
            enum: [structured, runtime, raw, full, legacy]
      responses:
        "200":
          $ref: "#/components/responses/ModelConfigResponse"

  /api/ue/config/model-config/placements:
    put:
      tags: [ue-config-model-config]
      summary: Update one or more placements
      security:
        - BearerAuth: []
        - GatewayToken: []
      description: Use transform as the canonical body. Top-level position/rotation/scale are deprecated compatibility fields. Do not mix transform with top-level position/rotation/scale. Forbidden fields such as bounds_size, uri, format, source_path, model_id, and display_name return 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelPlacementsRequest"
      responses:
        "200":
          $ref: "#/components/responses/StructuredModelConfigResponse"
        "400":
          $ref: "#/components/responses/JSONError"
        "413":
          $ref: "#/components/responses/RequestTooLarge"

  /api/ue/config/model-config/placements/{instance_id}:
    put:
      tags: [ue-config-model-config]
      summary: Update one placement
      security:
        - BearerAuth: []
        - GatewayToken: []
      description: Same semantics as batch placement PUT. Server should send visible and transform.
      parameters:
        - name: instance_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelPlacementRequest"
      responses:
        "200":
          $ref: "#/components/responses/StructuredModelConfigResponse"
        "400":
          $ref: "#/components/responses/JSONError"
        "413":
          $ref: "#/components/responses/RequestTooLarge"

  /api/ue/config/model-config/placements/delete:
    delete:
      tags: [ue-config-model-config]
      summary: Delete placement rows
      security:
        - BearerAuth: []
        - GatewayToken: []
      description: Uses a JSON request body matching entries/delete. Physically deletes placement rows, ignores missing ids, and returns structured model_config. Enabled instances without a placement use default visible=true, position=0, rotation=0, scale=1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstanceIDsRequest"
      responses:
        "200":
          $ref: "#/components/responses/StructuredModelConfigResponse"
        "400":
          $ref: "#/components/responses/JSONError"
        "413":
          $ref: "#/components/responses/RequestTooLarge"

  /api/ue/config/scene-desired:
    get:
      tags: [ue-config-scene]
      summary: Get scene_desired_config
      description: Default mode=generated joins ue_model_types, ue_model_instances, and ue_model_instance_placements. mode=legacy reads raw ue_config_documents.scene_desired_config.
      parameters:
        - name: mode
          in: query
          schema:
            type: string
            enum: [generated, legacy]
      responses:
        "200":
          $ref: "#/components/responses/SceneDesiredResponse"
        "404":
          $ref: "#/components/responses/JSONError"

  /api/ue/config/chart-binding:
    get:
      tags: [ue-config-read]
      summary: Get chart_binding config
      responses:
        "200":
          $ref: "#/components/responses/ChartBindingResponse"
    put:
      tags: [ue-config-read]
      summary: Replace chart_binding document
      security:
        - BearerAuth: []
        - GatewayToken: []
      description: Whole-document raw JSON replace in ue_config_documents.chart_binding. Does not update data_bindings.
      requestBody:
        $ref: "#/components/requestBodies/RawJSONObject"
      responses:
        "200":
          $ref: "#/components/responses/ChartBindingResponse"
        "400":
          $ref: "#/components/responses/JSONError"
        "413":
          $ref: "#/components/responses/RequestTooLarge"

  /api/ue/config/video-streams:
    get:
      tags: [ue-config-read]
      summary: Get video_streams config
      responses:
        "200":
          $ref: "#/components/responses/VideoStreamsResponse"
    put:
      tags: [ue-config-read]
      summary: Replace video_streams document
      security:
        - BearerAuth: []
        - GatewayToken: []
      description: Whole-document raw JSON replace in ue_config_documents.video_streams. Does not update video_sources.
      requestBody:
        $ref: "#/components/requestBodies/RawJSONObject"
      responses:
        "200":
          $ref: "#/components/responses/VideoStreamsResponse"
        "400":
          $ref: "#/components/responses/JSONError"

  /api/ue/config/chart-config:
    get:
      tags: [ue-config-read]
      summary: Get chart_config
      description: mode=runtime is a Gateway readable snapshot from structured chart_config plus latest Redis/runtime cache. It is not the authoritative Server real-time chart_data write channel; real-time chart push remains Server/FastAPI WebSocket responsibility.
      responses:
        "200":
          $ref: "#/components/responses/ChartConfigResponse"
    put:
      tags: [ue-config-read]
      summary: Replace chart_config document
      security:
        - BearerAuth: []
        - GatewayToken: []
      description: Whole-document raw JSON replace in ue_config_documents.chart_config. Does not update ue_chart_configs or runtime cache.
      requestBody:
        $ref: "#/components/requestBodies/RawJSONObject"
      responses:
        "200":
          $ref: "#/components/responses/ChartConfigResponse"
        "400":
          $ref: "#/components/responses/JSONError"

  /api/ue/config/report-scripts:
    get:
      tags: [ue-config-read]
      summary: Get report_scripts config
      description: |
        Default/full/raw returns ue_config_documents.report_scripts.content_json.
        mode=light or mode=generated returns generated light report_scripts from scripts/script_modules/data_bindings/video_sources.
        Generated light warmup uses the same ID semantics as full/raw report_scripts: data=data_script_id, charts=binding_id, videos=video_id.
        Generated warmup.charts lists only data_bindings.binding_id values that can be pushed; it does not use chart_id.
        Layered CRUD rewrites report_scripts using the current Gateway protocol schema; unknown fields that are not defined by the protocol are not preserved.
      responses:
        "200":
          $ref: "#/components/responses/ReportScriptsResponse"
    put:
      tags: [ue-config-read]
      summary: Replace report_scripts document
      security:
        - BearerAuth: []
        - GatewayToken: []
      description: Whole-document raw JSON replace in ue_config_documents.report_scripts. Does not update scripts or script_modules.
      requestBody:
        $ref: "#/components/requestBodies/RawJSONObject"
      responses:
        "200":
          $ref: "#/components/responses/ReportScriptsResponse"
        "400":
          $ref: "#/components/responses/JSONError"

  /api/ue/config/report-scripts/scripts/create:
    post:
      tags: [ue-config-write]
      summary: Create report script
      security:
        - BearerAuth: []
        - GatewayToken: []
      description: Creates one script in raw/full report_scripts. Existing same script_id with same label is idempotent; different label returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportScriptRequest"
      responses:
        "200": {$ref: "#/components/responses/ReportScriptsResponse"}
        "400": {$ref: "#/components/responses/JSONError"}
        "409": {$ref: "#/components/responses/JSONError"}

  /api/ue/config/report-scripts/scripts:
    put:
      tags: [ue-config-write]
      summary: Update or rename report script
      security:
        - BearerAuth: []
        - GatewayToken: []
      description: Updates script_id/label only and preserves chapters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportScriptRequest"
      responses:
        "200": {$ref: "#/components/responses/ReportScriptsResponse"}
        "400": {$ref: "#/components/responses/JSONError"}
        "404": {$ref: "#/components/responses/JSONError"}
        "409": {$ref: "#/components/responses/JSONError"}

  /api/ue/config/report-scripts/scripts/delete:
    delete:
      tags: [ue-config-write]
      summary: Delete report script
      security:
        - BearerAuth: []
        - GatewayToken: []
      description: Deletes a script and all nested chapters/scenes. Missing script_id is still success.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportScriptRequest"
      responses:
        "200": {$ref: "#/components/responses/ReportScriptsResponse"}
        "400": {$ref: "#/components/responses/JSONError"}

  /api/ue/config/report-scripts/chapters/create:
    post:
      tags: [ue-config-write]
      summary: Create report chapter
      security:
        - BearerAuth: []
        - GatewayToken: []
      description: Creates one chapter under a script. The new chapter starts with scenes=[].
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportChapterRequest"
      responses:
        "200": {$ref: "#/components/responses/ReportScriptsResponse"}
        "400": {$ref: "#/components/responses/JSONError"}
        "404": {$ref: "#/components/responses/JSONError"}
        "409": {$ref: "#/components/responses/JSONError"}

  /api/ue/config/report-scripts/chapters:
    put:
      tags: [ue-config-write]
      summary: Update or rename report chapter
      security:
        - BearerAuth: []
        - GatewayToken: []
      description: Updates chapter_id/label only and preserves scenes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportChapterRequest"
      responses:
        "200": {$ref: "#/components/responses/ReportScriptsResponse"}
        "400": {$ref: "#/components/responses/JSONError"}
        "404": {$ref: "#/components/responses/JSONError"}
        "409": {$ref: "#/components/responses/JSONError"}

  /api/ue/config/report-scripts/chapters/delete:
    delete:
      tags: [ue-config-write]
      summary: Delete report chapter
      security:
        - BearerAuth: []
        - GatewayToken: []
