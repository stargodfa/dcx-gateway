      properties:
        data:
          type: array
          items: {type: string}
        videos:
          type: array
          items: {type: string}
        charts:
          type: array
          items: {type: string}
    WarmupOptions:
      type: object
      required: [version, data_scripts, charts, videos, instances]
      properties:
        version: {type: integer, example: 1}
        data_scripts:
          type: array
          items:
            $ref: "#/components/schemas/WarmupDataScriptOption"
        charts:
          type: array
          items:
            $ref: "#/components/schemas/WarmupChartOption"
        videos:
          type: array
          items:
            $ref: "#/components/schemas/WarmupVideoOption"
        instances:
          type: array
          items:
            $ref: "#/components/schemas/WarmupInstanceOption"
    WarmupDataScriptOption:
      type: object
      properties:
        data_script_id: {type: string, example: security_main}
        label: {type: string, example: 安防汇报脚本}
        data_scene_id: {type: string, example: campus_security}
        data_keys:
          type: array
          items: {type: string}
          example: [security.access.today, security.fire.status]
    WarmupChartOption:
      type: object
      properties:
        binding_id:
          type: string
          example: sim_3
          description: chart_data_push payload binding_id; this is the value used by warmup.charts.
        chart_id: {type: string, example: chart_h}
        title: {type: string, example: 今日出入人数}
        data_key: {type: string, example: security.access.today}
        data_script_id: {type: string, example: security_main}
        module_id: {type: string, example: today_access_card}
    WarmupVideoOption:
      type: object
      properties:
        video_id: {type: string, example: vs_cam_65}
        title: {type: string, example: 校门口监控}
        play_url: {type: string, example: "http://example.test/cam_65"}
        data_script_id: {type: string, example: security_main}
        module_id: {type: string, example: gate_video_panel}
    WarmupInstanceOption:
      type: object
      properties:
        instance_id: {type: string, example: demo_model_1}
        model_id: {type: string, example: demo_model}
        display_name: {type: string, example: 演示模型}
        enabled: {type: boolean, example: true}
    ReportScenePreloadRequest:
      type: object
      required: [script_id, chapter_id, scene_id]
      properties:
        script_id:
          type: string
          example: security_main
          description: report_scripts script_id, not data_script_id.
        chapter_id: {type: string, example: demo_chapter}
        scene_id:
          type: string
          example: demo_scene
          description: report_scripts scene_id, not DataBundle data_scene_id.
        force:
          type: boolean
          default: true
        push_ws:
          type: boolean
          default: true
    ReportScenePreloadResponse:
      type: object
      properties:
        version: {type: integer, example: 1}
        script_id: {type: string, example: security_main}
        chapter_id: {type: string, example: demo_chapter}
        scene_id: {type: string, example: demo_scene}
        warmup:
          $ref: "#/components/schemas/ReportWarmup"
        results:
          type: array
          items:
            $ref: "#/components/schemas/ReportScenePreloadResult"
    ReportScenePreloadResult:
      type: object
      properties:
        data_script_id: {type: string, example: security_main}
        force: {type: boolean, example: true}
        push_ws: {type: boolean, example: true}
        success: {type: boolean, example: true}
        bundle_id: {type: string, example: bundle_123}
        error: {type: string, example: ""}
        charts_requested:
          type: array
          items: {type: string}
          example: [sim_3]
        videos_requested:
          type: array
          items: {type: string}
          example: [vs_cam_65]
    BootstrapConfig:
      type: object
      required: [version, init_config, path_config, chart_config, chart_binding, drone_config, model_table, model_config, scene_desired]
      properties:
        version: {type: integer}
        init_config:
          $ref: "#/components/schemas/InitConfig"
        path_config:
          $ref: "#/components/schemas/PathConfig"
        chart_config:
          $ref: "#/components/schemas/ChartConfig"
        chart_binding:
          $ref: "#/components/schemas/ChartBinding"
        drone_config:
          $ref: "#/components/schemas/DroneConfig"
        model_table:
          $ref: "#/components/schemas/ModelTable"
        model_config:
          $ref: "#/components/schemas/RuntimeModelConfig"
        scene_desired:
          $ref: "#/components/schemas/SceneDesiredConfig"
    UpdateInitConfigRequest:
      type: object
      properties:
        camera_id: {type: string}
        position:
          $ref: "#/components/schemas/Vector3"
        rotation:
          $ref: "#/components/schemas/Rotation"
        auto_load_on_startup: {type: boolean}
    InstanceIDsRequest:
      type: object
      properties:
        instance_id: {type: string}
        instance_ids:
          type: array
          items: {type: string}
    ModelTypeIDsRequest:
      type: object
      properties:
        model_id: {type: string}
        model_ids:
          type: array
          items: {type: string}
    ModelTypesRequest:
      oneOf:
        - type: object
          properties:
            model_id: {type: string, example: demo_model}
            uri: {type: string, example: "file://./models/demo/demo.udatasmith"}
            format: {type: string, example: udatasmith}
            source_path: {type: string, example: "./models/demo/demo.udatasmith"}
            base_bounds_size:
              $ref: "#/components/schemas/BoundsSize"
            bounds_negative_extent_axis:
              type: integer
              nullable: true
              example: null
            enabled: {type: boolean, example: true}
        - type: object
          properties:
            model_types:
              type: array
              items:
                $ref: "#/components/schemas/ModelType"
    ModelTable:
      type: object
      properties:
        version: {type: integer}
        entries:
          type: array
          items:
            type: object
            properties:
              instance_id: {type: string}
              model_id: {type: string}
              display_name: {type: string}
    ModelTableEntriesRequest:
      oneOf:
        - type: object
          properties:
            instance_id: {type: string}
            model_id: {type: string}
            display_name: {type: string}
            sort_order: {type: integer}
            enabled: {type: boolean}
        - type: object
          properties:
            entries:
              type: array
              items:
                type: object
                properties:
                  instance_id: {type: string, example: demo_model_1}
                  model_id: {type: string, example: demo_model}
                  display_name: {type: string, example: 演示模型}
                  sort_order: {type: integer, example: 10}
                  enabled: {type: boolean, example: true}
    ModelPlacementRequest:
      type: object
      description: transform is canonical. Top-level position/rotation/scale are deprecated compatibility fields and must not be mixed with transform.
      properties:
        visible: {type: boolean}
        transform:
          $ref: "#/components/schemas/Transform"
        position:
          allOf:
            - $ref: "#/components/schemas/Vector3"
          deprecated: true
        rotation:
          allOf:
            - $ref: "#/components/schemas/Rotation"
          deprecated: true
        scale:
          allOf:
            - $ref: "#/components/schemas/Vector3"
          deprecated: true
    ModelPlacementsRequest:
      oneOf:
        - allOf:
            - $ref: "#/components/schemas/ModelPlacementRequest"
            - type: object
              properties:
                instance_id: {type: string}
        - type: object
          properties:
            placements:
              type: array
              items:
                allOf:
                  - $ref: "#/components/schemas/ModelPlacementRequest"
                  - type: object
                    properties:
                      instance_id: {type: string}
